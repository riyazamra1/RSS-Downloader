name: Fix download notification lifecycle

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch foreground service lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/com/riyaz/rssdownloader/MainActivity.kt')
          s = p.read_text()
          s = s.replace('        startDownloadKeepAlive()\n        requestNotificationPermissionIfNeeded()\n', '')
          s = s.replace('        startDownloadKeepAlive()\n        requestNotificationPermissionIfNeeded()\n', '')
          old = '            result.onSuccess { showDownloads() }.onFailure { toast(it.message ?: "Download failed.") }'
          new = '''            result.onSuccess {
                if (Build.VERSION.SDK_INT >= 33 && ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                    requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 4102)
                } else {
                    startDownloadKeepAlive()
                }
                showDownloads()
            }.onFailure { toast(it.message ?: "Download failed.") }'''
          if old in s:
              s = s.replace(old, new, 1)
          marker = '    private fun startDownloadKeepAlive() {'
          if 'override fun onRequestPermissionsResult' not in s:
              insert = '''    override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
        super.onRequestPermissionsResult(requestCode, permissions, grantResults)
        if (requestCode == 4102 && grantResults.firstOrNull() == PackageManager.PERMISSION_GRANTED) {
            startDownloadKeepAlive()
        }
    }

'''
              s = s.replace(marker, insert + marker, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/riyaz/rssdownloader/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m 'fix(android): start foreground service only during downloads'
          git push
