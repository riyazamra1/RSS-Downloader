name: RSS Downloader Movie Tabs Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify movie-tab implementation
        run: |
          set -euo pipefail
          test -f android/app/src/main/java/com/riyaz/rssdownloader/MainActivity.kt
          test -f android/app/src/main/java/com/riyaz/rssdownloader/NativeHostApi.kt
          grep -q 'loadLatestMovies' android/app/src/main/java/com/riyaz/rssdownloader/MainActivity.kt
          grep -q 'showTabOrderDialog' android/app/src/main/java/com/riyaz/rssdownloader/MainActivity.kt
          grep -q 'movieSearch' android/app/src/main/java/com/riyaz/rssdownloader/MainActivity.kt
          grep -q 'RSS_HOST_BASE_URL' android/app/build.gradle.kts
          echo "Movie tabs, search, persistent ordering and RSS Core wiring are present."

      - name: Verify Android source compatibility
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/java/com/riyaz/rssdownloader/MainActivity.kt")
          s = p.read_text()
          assert "setHintTextColor(muted())" in s
          assert "ColorDrawableCompat.transparent()" in s
          print("Source compatibility checks passed.")
          PY
