name: RSS Downloader Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JavaScript dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Bundle RSS Core + RAY runtime
        run: npx esbuild android/runtime-entry.ts --bundle --format=iife --platform=browser --target=es2022 --outfile=android/app/src/main/assets/android-runtime.js
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare UI and exact logo assets
        run: |
          mkdir -p android/app/src/main/assets/ui android/app/src/main/res/drawable-nodpi
          cp -R ui/. android/app/src/main/assets/ui/
          cp rss-downloader-logo.png android/app/src/main/assets/rss-downloader-logo.png
          cp rss-downloader-logo.png android/app/src/main/res/drawable-nodpi/rss_downloader_logo.png
      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rss-downloader-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
