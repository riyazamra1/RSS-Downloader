name: RSS Downloader Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify build environment
        run: |
          set -euo pipefail
          command -v git
          command -v node
          command -v npm
          command -v java
          command -v curl
          command -v unzip
          java -version
          node --version
          npm --version

      - name: Install Android SDK components when sdkmanager is available
        run: |
          set -euo pipefail
          SDKMANAGER=""
          for candidate in \
            "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" \
            "$HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager"; do
            if [[ -x "$candidate" ]]; then SDKMANAGER="$candidate"; break; fi
          done
          if [[ -n "$SDKMANAGER" ]]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          else
            echo "sdkmanager not found; relying on the preinstalled Android SDK."
          fi

      - name: Prepare native Android logo asset
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp rss-downloader-logo.png android/app/src/main/res/drawable-nodpi/rss_downloader_logo.png
          rm -rf android/app/src/main/assets/ui android/app/src/main/assets/android-runtime.js

      - name: Build APK
        run: |
          set -euo pipefail
          chmod +x scripts/build-android.sh
          ./scripts/build-android.sh

      - name: Verify APK and checksum
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee apk.sha256
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rss-downloader-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk.sha256

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          TAG="apk-${GITHUB_RUN_NUMBER}"
          NAME="RSS Downloader APK ${GITHUB_RUN_NUMBER}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API/releases" \
            -d "$(python3 - <<'PY'
import json, os
print(json.dumps({
  'tag_name': os.environ['TAG'],
  'target_commitish': os.environ['GITHUB_SHA'],
  'name': os.environ['NAME'],
  'body': 'RSS Downloader Android debug APK build ' + os.environ['GITHUB_RUN_NUMBER'],
  'draft': False,
  'prerelease': False
}))
PY
)" \
            > release.json

          RELEASE_ID="$(python3 -c 'import json; print(json.load(open("release.json"))["id"])')"
          UPLOAD_URL="https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=RSS-Downloader-debug.apk"

          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@${APK}" \
            "$UPLOAD_URL" \
            > asset.json

          DOWNLOAD_URL="$(python3 -c 'import json; print(json.load(open("asset.json"))["browser_download_url"])')"
          echo "APK_DOWNLOAD_URL=${DOWNLOAD_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "APK_DOWNLOAD_URL=${DOWNLOAD_URL}"
