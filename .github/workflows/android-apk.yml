name: RSS Downloader Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare release source
        run: python3 scripts/prepare-android-build.py

      - name: Verify build environment
        run: |
          set -euo pipefail
          command -v java
          command -v node
          command -v npm
          java -version
          node --version
          npm --version

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER=""
          for candidate in "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" "$HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager"; do
            if [[ -x "$candidate" ]]; then SDKMANAGER="$candidate"; break; fi
          done
          if [[ -n "$SDKMANAGER" ]]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          else
            echo "sdkmanager not found; using preinstalled SDK"
          fi

      - name: Prepare native Android logo asset
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp rss-downloader-logo.png android/app/src/main/res/drawable-nodpi/rss_downloader_logo.png
          rm -rf android/app/src/main/assets/ui android/app/src/main/assets/android-runtime.js

      - name: Normalize Kotlin UI compatibility
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/java/com/riyaz/rssdownloader/MainActivity.kt")
          text = path.read_text()
          text = text.replace("hintTextColor = muted()", "setHintTextColor(muted())")
          text = text.replace("background = ColorDrawableCompat.transparent()", "background = android.graphics.drawable.ColorDrawable(Color.TRANSPARENT)")
          path.write_text(text)
          PY

      - name: Build APK
        run: |
          set -euo pipefail
          chmod +x scripts/build-android.sh
          ./scripts/build-android.sh

      - name: Verify APK and checksum
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee apk.sha256
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rss-downloader-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk.sha256
