name: RSS Downloader Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare UI assets
        run: |
          mkdir -p android/app/src/main/assets/ui
          cp -R ui/. android/app/src/main/assets/ui/
          cp rss-downloader-logo.png android/app/src/main/assets/rss-downloader-logo.png
      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rss-downloader-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
