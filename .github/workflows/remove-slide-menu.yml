name: Remove slide menu

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-slide-menu:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair native Android functional flows
        shell: python
        run: |
          from pathlib import Path
          p = Path('android/app/src/main/java/com/riyaz/rssdownloader/MainActivity.kt')
          s = p.read_text()
          s = s.replace('    private lateinit var sideMenu: LinearLayout\n', '')
          s = s.replace('        sideMenu = buildSideMenu()\n        val frame = FrameLayout(this)\n        frame.addView(root)\n        frame.addView(sideMenu, FrameLayout.LayoutParams(dp(76), -1))\n        setContentView(frame)\n', '        setContentView(root)\n')
          s = s.replace('        setPadding(dp(88), dp(10), dp(12), dp(10))', '        setPadding(dp(16), dp(10), dp(12), dp(10))')
          s = s.replace('        addView(button("☰", 46) { toggleMenu() })\n', '')
          start = s.find('    private fun buildSideMenu(): LinearLayout = LinearLayout(this).apply {')
          end = s.find('    private fun showHome() {', start)
          if start != -1 and end != -1:
              s = s[:start] + s[end:]
          s = s.replace('    private fun toggleMenu() { val lp = sideMenu.layoutParams as FrameLayout.LayoutParams; lp.width = if (lp.width == dp(76)) dp(300) else dp(76); sideMenu.layoutParams = lp }\n', '')
          s = s.replace('    private fun closeMenu() { (sideMenu.layoutParams as FrameLayout.LayoutParams).also { it.width = dp(76); sideMenu.layoutParams = it } }\n', '')
          s = s.replace('setPadding(dp(94), dp(10), dp(18), dp(18))', 'setPadding(dp(18), dp(10), dp(18), dp(18))')
          s = s.replace('setPadding(dp(94), dp(18), dp(18), dp(18))', 'setPadding(dp(18), dp(18), dp(18), dp(18))')
          s = s.replace('showDownloads(); closeMenu()', 'showDownloads()')
          s = s.replace('showSettings(); closeMenu()', 'showSettings()')

          start = s.find('    private fun renderOptions(requestId: String, options: List<NativeHostApi.MediaOption>) {')
          end = s.find('    private fun createDownload(', start)
          if start != -1 and end != -1:
              replacement = '''    private fun renderOptions(requestId: String, options: List<NativeHostApi.MediaOption>) {
                  val target = if (mediaPanel.parent != null) mediaPanel else (content.findViewWithTag<LinearLayout>("movie-options") ?: LinearLayout(this).apply {
                      tag = "movie-options"
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(18), dp(10), dp(18), dp(10))
                      content.addView(this)
                  })
                  target.visibility = View.VISIBLE
                  target.removeAllViews()
                  if (options.isEmpty()) {
                      target.addView(text("RSS Core returned no authorized formats.", 13, muted(), false))
                      return
                  }
                  target.addView(text("Choose an authorized format", 13, muted(), false))
                  options.forEach { option ->
                      val row = LinearLayout(this).apply { gravity = Gravity.CENTER_VERTICAL; setPadding(0, dp(13), 0, dp(13)) }
                      row.addView(LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.VERTICAL
                          addView(text(option.kind.uppercase(Locale.US), 13, textColor(), true))
                          addView(text(listOfNotNull(option.format, option.quality, option.sizeBytes?.let(::formatBytes)).joinToString(" • "), 11, muted(), false))
                      }, LinearLayout.LayoutParams(0, -2, 1f))
                      row.addView(primaryButton("Download") { createDownload(requestId, option.id) })
                      target.addView(row)
                  }
              }

'''
              s = s[:start] + replacement + s[end:]

          old = '''        currentTab = TabOrder.SOCIAL
        if (urlInput.text.toString() != value) urlInput.setText(value)'''
          new = '''        val tabChanged = currentTab != TabOrder.SOCIAL
        currentTab = TabOrder.SOCIAL
        if (tabChanged) showHome()
        if (::urlInput.isInitialized && urlInput.text.toString() != value) urlInput.setText(value)'''
          s = s.replace(old, new)
          p.write_text(s)
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/riyaz/rssdownloader/MainActivity.kt
          git diff --cached --quiet || git commit -m 'fix(android): repair movie options and clipboard flow'
          git push
