name: Fix functional flows
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch native functional flows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/com/riyaz/rssdownloader/MainActivity.kt')
          s = p.read_text()

          s = s.replace(
              'private fun renderOptions(requestId: String, options: List<NativeHostApi.MediaOption>) {',
              'private fun renderOptions(target: LinearLayout, requestId: String, options: List<NativeHostApi.MediaOption>) {'
          )
          s = s.replace('mediaPanel.visibility = View.VISIBLE\n        mediaPanel.removeAllViews()', 'target.visibility = View.VISIBLE\n        target.removeAllViews()')
          s = s.replace('mediaPanel.addView(text("RSS Core returned no authorized formats.", 13, muted(), false))', 'target.addView(text("RSS Core returned no authorized formats.", 13, muted(), false))')
          s = s.replace('mediaPanel.addView(text("Choose an authorized format", 13, muted(), false))', 'target.addView(text("Choose an authorized format", 13, muted(), false))')
          s = s.replace('mediaPanel.addView(row)', 'target.addView(row)')
          s = s.replace('renderOptions(analysis.requestId, analysis.mediaOptions)', 'renderOptions(mediaPanel, analysis.requestId, analysis.mediaOptions)')

          old = '''                if (results.isEmpty()) panel.addView(text("No results returned by RSS Core.", 13, muted(), false).apply { setPadding(0, dp(12), 0, dp(8)) })
                results.forEach { item ->'''
          new = '''                val optionsPanel = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(0, dp(8), 0, dp(8)) }
                panel.addView(optionsPanel)
                if (results.isEmpty()) panel.addView(text("No results returned by RSS Core.", 13, muted(), false).apply { setPadding(0, dp(12), 0, dp(8)) })
                results.forEach { item ->'''
          if old not in s:
              raise SystemExit('movie results anchor not found')
          s = s.replace(old, new)

          old = '''                    row.addView(primaryButton("Select") {
                        if (item.mediaOptions.isNotEmpty()) renderOptions(item.requestId ?: item.id, item.mediaOptions)
                        else toast("No authorized quality options available.")
                    })'''
          new = '''                    row.addView(primaryButton("Select") {
                        val requestId = item.requestId
                        if (item.mediaOptions.isNotEmpty() && requestId != null) {
                            renderOptions(optionsPanel, requestId, item.mediaOptions)
                        } else if (requestId != null) {
                            optionsPanel.removeAllViews()
                            optionsPanel.addView(text("Loading quality options…", 13, muted(), false))
                            api.listMediaOptions(requestId) { optionsResult -> runOnUiThread {
                                optionsResult.onSuccess { options -> renderOptions(optionsPanel, requestId, options) }
                                    .onFailure { optionsPanel.removeAllViews(); optionsPanel.addView(text(it.message ?: "Failed to load quality options.", 13, muted(), false)) }
                            }}
                        } else {
                            optionsPanel.removeAllViews()
                            optionsPanel.addView(text("RSS Core did not return a request ID for this result.", 13, muted(), false))
                        }
                    })'''
          if old not in s:
              raise SystemExit('movie select anchor not found')
          s = s.replace(old, new)

          old = '''    private fun readClipboardUrl(autoAnalyze: Boolean) {
        if (!prefs.getBoolean("clipboard", true) || !::urlInput.isInitialized) return
        val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
        val clip = cm.primaryClip ?: return
        if (cm.primaryClipDescription?.hasMimeType(ClipDescription.MIMETYPE_TEXT_PLAIN) != true) return
        val value = clip.getItemAt(0).coerceToText(this).toString().trim()
        if (!value.startsWith("http://") && !value.startsWith("https://")) return
        currentTab = TabOrder.SOCIAL
        if (urlInput.text.toString() != value) urlInput.setText(value)
        if (autoAnalyze && prefs.getString("lastClipboardUrl", "") != value) {
            prefs.edit().putString("lastClipboardUrl", value).apply()
            urlInput.postDelayed({ if (!isFinishing && currentTab == TabOrder.SOCIAL) analyzeUrl() }, 180)
        }
    }'''
          new = '''    private fun readClipboardUrl(autoAnalyze: Boolean) {
        if (!prefs.getBoolean("clipboard", true) || !::urlInput.isInitialized) return
        val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
        val clip = cm.primaryClip ?: return
        if (cm.primaryClipDescription?.hasMimeType(ClipDescription.MIMETYPE_TEXT_PLAIN) != true) return
        val value = clip.getItemAt(0).coerceToText(this).toString().trim()
        if (!value.startsWith("http://") && !value.startsWith("https://")) return
        val tabChanged = currentTab != TabOrder.SOCIAL
        currentTab = TabOrder.SOCIAL
        if (tabChanged) {
            showHome()
        }
        if (::urlInput.isInitialized && urlInput.text.toString() != value) urlInput.setText(value)
        if (autoAnalyze && prefs.getString("lastClipboardUrl", "") != value) {
            prefs.edit().putString("lastClipboardUrl", value).apply()
            urlInput.postDelayed({ if (!isFinishing && currentTab == TabOrder.SOCIAL) analyzeUrl() }, 180)
        }
    }'''
          if old not in s:
              raise SystemExit('clipboard anchor not found')
          s = s.replace(old, new)

          p.write_text(s)
          PY
      - name: Commit functional patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/riyaz/rssdownloader/MainActivity.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(android): repair movie options and clipboard flow'
          git push
