<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="RSS Downloader by Razeen Secure Solution">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>RSS Downloader</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img src="../rss-downloader-logo.png" alt="RSS Downloader" class="logo">
        <div><strong>RSS Downloader</strong><span>Fast. Organized. Controlled.</span></div>
      </div>
      <div class="top-actions">
        <button id="appearanceButton" class="icon-button" aria-label="Change appearance" title="Appearance">◐</button>
        <button id="downloadsButton" class="icon-button" aria-label="Downloads">↓ <span id="downloadBadge">0</span></button>
      </div>
    </header>

    <main>
      <nav id="tabs" class="tabs" aria-label="Downloader tabs"></nav>

      <section id="homeView" class="view">
        <div class="hero-card">
          <div class="hero-copy">
            <p class="eyebrow">SOCIAL DOWNLOADER</p>
            <h1>Paste a link.<br>RSS handles the rest.</h1>
            <p class="muted">Copy a supported URL and it will be detected automatically.</p>
          </div>
          <div class="url-row">
            <input id="urlInput" autocomplete="off" inputmode="url" placeholder="Paste URL here…">
            <button id="analyzeButton" class="primary">Analyze</button>
          </div>
          <div id="analysisState" class="state" hidden></div>
        </div>
        <section id="mediaOptions" class="panel" hidden></section>
        <div class="movie-grid" id="movieSearchArea"></div>
      </section>

      <section id="downloadsView" class="view" hidden>
        <div class="page-heading"><div><p class="eyebrow">DOWNLOADS</p><h2>Downloads</h2></div><button id="refreshDownloads" class="secondary">Refresh</button></div>
        <div class="segmented"><button data-view="ongoing" class="active">Ongoing</button><button data-view="all">All Downloads</button></div>
        <div id="downloadsState" class="state" hidden></div>
        <section><h3>Ongoing Downloads</h3><div id="ongoingList" class="download-list"></div></section>
        <section id="historySection" hidden><h3>All Downloads</h3><div id="historyList" class="download-list"></div></section>
      </section>
    </main>
  </div>
  <script src="./app.js"></script>
</body>
</html>
