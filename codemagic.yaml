workflows:
  rss_downloader_android:
    name: RSS Downloader Android
    max_build_duration: 60
    environment:
      java: 17

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Verify Android project
        script: |
          set -e
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts

      - name: Build debug APK
        script: |
          set -e
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH="/tmp/gradle-8.9/bin:$PATH"
          cd android
          gradle --version
          gradle --no-daemon --stacktrace :app:assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - rsscctvsolution@gmail.com
        notify:
          success: true
          failure: true
