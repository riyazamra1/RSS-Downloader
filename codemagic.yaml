workflows:
  rss_downloader_android:
    name: RSS Downloader Android
    max_build_duration: 60
    environment:
      java: 17

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Verify Android project
        script: |
          set -e
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts

      - name: Prepare Android SDK location
        script: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
          test -s "$CM_BUILD_DIR/android/local.properties"

      - name: Build debug APK
        script: |
          set -e
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH="/tmp/gradle-8.9/bin:$PATH"
          cd android
          gradle --version
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK artifact
        script: |
          set -e
          APK="$CM_BUILD_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          AAPT2=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          test -x "$AAPT2"
          BADGING="$("$AAPT2" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.riyaz.rssdownloader'"
          echo "$BADGING" | grep -F "versionCode='3'"
          echo "$BADGING" | grep -F "versionName='3.2'"
          echo "RSS Downloader APK artifact verification passed."

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - rsscctvsolution@gmail.com
        notify:
          success: true
          failure: true
